name: Deployment application

on:
  workflow_call:
   
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string      

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  
  deploy-helm:

    name: Deploy application
        
    runs-on: ubuntu-latest

    steps:
      
      - name: Deploy application
        run: |
          echo "Deploying application to ${{ inputs.environment }} environment with image tag ${{ inputs.image_tag }}"
         
  scan-BackEnd:

    name: DAST - Scan BackEnd
  
    runs-on: ubuntu-latest
    
    needs: deploy-helm
    
    steps:
    
    - name: DAST - Scan BackEnd
      run: |
        echo "Scanning application BackEnd (DAST)"

  scan-FrontEnd:

    name: DAST - Scan FrontEnd
      
    runs-on: ubuntu-latest

    needs: deploy-helm

    steps:
    
    - name: DAST - Scan FrontEnd
      run: |
        echo "Scanning application FrontEnd (DAST)"